[workspace]
resolver = "2"
members = [
    "crates/r2-types",
    "crates/r2-ir",
    "crates/r2-jit",
    "crates/r2-oracle",
    "crates/r2-arrow",
    "crates/r2-kernel",
    "crates/r2-ml",
    "crates/r2-data",
    "crates/r2-parser",
    "crates/r2-memory",
    "crates/r2-linalg",
    "crates/r2-engine",
    "crates/r2-base",
    "crates/r2-stats",
    "crates/r2-graphics",
    "crates/r2-strings",
    "crates/r2-io",
    "crates/r2-utils",
    "crates/r2-pkg",
    "crates/r2-console",
    "crates/r2-ui",
    "crates/r2-repl",
    "crates/r2-gui",
    "crates/r2-gpu",
    "crates/r2-mesh",
    "crates/r2-train",
    "crates/r2-tensor",
    "crates/r2-autograd",
    "crates/r2-panel",
]

# ── The product version — the ONLY place it is written ────────────────
# r2-repl, r2-gui and r2-panel inherit it (`version.workspace = true`);
# the exes carry it as their FileVersion, installer/R2.iss reads it back
# from r2.exe, and the README badge reads the latest GitHub release.
# A release is: bump this line, add the CHANGELOG heading (a test in
# r2-repl fails without it), commit, tag v<version>.
[workspace.package]
version = "0.4.1"

[workspace.dependencies]
thiserror = "1"

# ── Release profile — optimized for the shipped installer ─────────────
# strip = "symbols"   drops debug symbols                  → ~5 MB binary
# lto   = "fat"       cross-crate inlining                 → ~10–20% smaller, faster
# codegen-units = 1   single codegen unit allows full LTO  → ~5% smaller
# panic = "abort"     skip unwinding tables                → smaller, faster panics
# opt-level = 3       maximum performance optimization
[profile.release]
strip = "symbols"
lto = "fat"
codegen-units = 1
panic = "abort"
opt-level = 3
