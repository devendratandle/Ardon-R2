[package]
name = "r2-train"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0"
description = "Training loop foundation: optimizer traits + the verified-innovation (fuzzy) core."

[dependencies]
r2-mesh = { path = "../r2-mesh" }
r2-tensor = { path = "../r2-tensor" }
r2-oracle = { path = "../r2-oracle" }
r2-gpu    = { path = "../r2-gpu" }
r2-autograd = { path = "../r2-autograd" }
r2-linalg = { path = "../r2-linalg" }   # step_census measures sgemm directly
# Out-of-core token storage (src/tokens.rs). ~10 KB compiled; the same
# crate r2-arrow already uses for its memory-mapped columns, so this adds
# no new third party to the workspace.
memmap2 = "0.9"

[features]
gpu = ["r2-tensor/gpu"]
