[package]
name = "r2-linalg"
version = "0.1.1"
edition = "2021"

# CPU-specific kernels are selected at RUNTIME inside this one rlib
# (`is_x86_feature_detected!` in level3.rs / gemm.rs): one binary runs
# on every x86-64 and uses the widest vectors the host has. See
# docs/BLAS_DISPATCH.md.

[dependencies]
# Multi-core dispatch for the Level-3 kernels. The Oracle decides the
# serial/parallel crossover (hardware-scaled); Rayon executes. r2-oracle
# has no deps of its own, so this adds no cycle.
rayon = "1.10"
r2-oracle = { path = "../r2-oracle" }

[dev-dependencies]
