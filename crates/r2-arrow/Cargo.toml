[package]
name = "r2-arrow"
version = "0.1.1"
edition = "2021"
license = "AGPL-3.0"
description = "Ardon-R2 columnar memory substrate (Phase F — Apache Arrow-compatible buffers)"

[features]
default = ["mmap"]
# Enable `MmapColumnar` for memory-mapped column reads. Pure-Rust dep
# (memmap2) ~10 KB compiled. Off → no mmap support.
mmap = ["dep:memmap2"]
# Enable the Parquet reader (Phase F.6 interop). Pulls the pure-Rust
# `parquet` + `arrow` crates (no C / FFI). Heavier dep tree + compile
# time; off by default so a bare r2-arrow stays light. The engine turns
# it on. Reads row-group by row-group (bounded memory for big files).
parquet = ["dep:parquet", "dep:arrow"]

[dependencies]
memmap2 = { version = "0.9", optional = true }
# Parquet + Arrow with the PURE-RUST codec set only: snappy (`snap`),
# gzip (`flate2` on its Rust backend), lz4 (`lz4_flex`), brotli. The
# crate's default set also enables `zstd`, which is `zstd-sys` — bundled C
# compiled through `cc` — and was the single C object in the shipped
# binary while the README promised none. A zstd-compressed Parquet file
# now fails to read with the codec named; recompress with snappy.
parquet = { version = "53", optional = true, default-features = false,
            features = ["arrow", "snap", "flate2", "lz4", "brotli", "base64"] }
arrow   = { version = "53", optional = true }
