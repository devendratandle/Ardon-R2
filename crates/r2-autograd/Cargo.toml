[package]
name = "r2-autograd"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0"
description = "Reverse-mode autograd over the r2-tensor transformer op set (Layer 4)."

[dependencies]
# Data-parallel backward pass; pure Rust, already a workspace dependency.
rayon = "1"
# Backend policy for the backward pass (same Oracle as the forward).
r2-oracle = { path = "../r2-oracle" }
r2-tensor = { path = "../r2-tensor" }

[features]
gpu = ["r2-tensor/gpu"]
